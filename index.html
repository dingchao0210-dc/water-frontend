<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南省智慧水网监测与调度示范应用系统</title>
    <link rel="stylesheet" href="css/dispatch.css">
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="top-header">
        <div class="header-left">
            <div class="logo-mark">
                <div class="logo-wave"></div>
                <div class="logo-wave"></div>
                <div class="logo-wave"></div>
            </div>
            <div class="title-group">
                <h1 class="system-title">河南省智慧水网监测与调度示范应用系统</h1>
                <span class="system-subtitle">Henan Smart Water Network Monitoring &amp; Dispatch System</span>
            </div>
        </div>
        <div class="header-center">
            <div class="header-time" id="headerTime">--:--:--</div>
        </div>
        <nav class="header-nav">
            <a href="#" class="nav-item">年度需水</a>
            <a href="#" class="nav-item">需水预测</a>
            <a href="#" class="nav-item">供水配置</a>
            <a href="#" class="nav-item active">水量调度</a>
            <a href="#" class="nav-item">水库配置</a>
            <a href="#" class="nav-item">调度方案</a>
        </nav>
        <div class="header-right">
            <span class="header-icon" title="搜索">&#128269;</span>
            <span class="header-icon bell-icon" title="通知">&#128276;<span class="bell-badge">3</span></span>
            <span class="header-icon" title="设置">&#9881;</span>
            <span class="header-icon" title="全屏">&#9974;</span>
        </div>
    </header>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-text">数据加载中...</div>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">

        <!-- 左侧面板 -->
        <aside class="left-panel">

            <!-- 方案设置 -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">方案设置</span>
                    <span class="panel-badge">实时</span>
                </div>
                <div class="panel-body">
                    <div class="info-row">
                        <span class="info-label">供水方案</span>
                        <span class="info-value text-yellow" id="supplyPlan">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">调度方案</span>
                        <span class="info-value text-yellow" id="dispatchPlan">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">方案时间</span>
                        <span class="info-value" id="planTime">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">方案状态</span>
                        <span class="info-value status-tag" id="planStatus">--</span>
                    </div>
                </div>
            </div>

            <!-- 调度总览 -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">水库总览</span>
                </div>
                <div class="panel-body">
                    <div class="kpi-row">
                        <div class="kpi-item">
                            <div class="kpi-icon-small kpi-icon-cyan">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                    <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/>
                                </svg>
                            </div>
                            <div class="kpi-text">
                                <span class="kpi-label-small">天数</span>
                                <span class="kpi-value-small" id="kpiDays">--<span class="kpi-unit-small">天</span></span>
                            </div>
                        </div>
                        <div class="kpi-divider"></div>
                        <div class="kpi-item">
                            <div class="kpi-icon-small kpi-icon-yellow">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                    <path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h4v4H7V7zm6 0h4v4h-4V7zm-6 6h4v4H7v-4zm6 0h4v4h-4v-4z"/>
                                </svg>
                            </div>
                            <div class="kpi-text">
                                <span class="kpi-label-small">灌片</span>
                                <span class="kpi-value-small" id="kpiAreas">--<span class="kpi-unit-small">个</span></span>
                            </div>
                        </div>
                        <div class="kpi-divider"></div>
                        <div class="kpi-item">
                            <div class="kpi-icon-small kpi-icon-green">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                    <path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2C20 10.48 17.33 6.55 12 2z"/>
                                </svg>
                            </div>
                            <div class="kpi-text">
                                <span class="kpi-label-small">水量</span>
                                <span class="kpi-value-small" id="kpiWater">--<span class="kpi-unit-small">万m³</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 供水水序 -->
            <div class="panel flex-1">
                <div class="panel-header">
                    <span class="panel-title">当天径流数据</span>
                    <span class="panel-badge badge-blue">3站</span>
                </div>
                <div class="panel-body scrollable">
                    <div class="timeline" id="timelineContainer">
                        <!-- 由 JS 动态生成 -->
                    </div>
                </div>
            </div>

        </aside>

        <!-- 中央地图区域 -->
        <main class="map-area">

            <!-- 地图背景层 -->
            <div class="map-bg"></div>

            <!-- 地图上方标签栏 -->
            <div class="map-tag-bar" id="mapTagBar">
                <!-- 由 JS 动态生成 -->
            </div>

            <!-- 地图数据气泡容器 -->
            <div id="mapBubblesContainer"></div>

            <!-- 地图渠道标签容器 -->
            <div id="canalLabelsContainer"></div>

            <!-- 底部渠道按钮栏 -->
            <div class="map-bottom-bar">
                <div class="channel-buttons" id="channelButtons">
                    <!-- 由 JS 动态生成 -->
                </div>
            </div>

            <!-- 右下角排沙数据面板 -->
            <div class="sediment-panel">
                <div class="panel-header">
                    <span class="panel-title">排沙数据</span>
                    <span class="panel-badge">实时</span>
                </div>
                <div class="panel-body scrollable">
                    <table class="sediment-table">
                        <thead>
                            <tr>
                                <th>水库名称</th>
                                <th>含沙量</th>
                                <th>排沙量</th>
                                <th>输沙率</th>
                            </tr>
                        </thead>
                        <tbody id="sedimentBody">
                            <!-- 由 JS 动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

    </div>

    <!-- 前端 JS -->
    <script src="js/dispatch.js"></script>

</body>
</html>
